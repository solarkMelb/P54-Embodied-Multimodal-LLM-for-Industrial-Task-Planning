services:
  ollama:
    image: ollama/ollama:latest
    container_name: p54_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  p54_ros:
    build:
      context: .
      dockerfile: Dockerfile.lab
    platform: linux/amd64
    container_name: p54_ros_pipeline
    env_file:
      - .env
    environment:
      # localhost, not the compose service name: network_mode below puts this
      # container on the host's network stack, where compose DNS does not
      # resolve "ollama". The ollama service publishes 11434 to the host, so
      # localhost reaches it.
      - OLLAMA_BASE_URL=http://localhost:11434
      - LLM_BACKEND=ollama
      - ROBOT_BACKEND=ros
      - ROS_DOMAIN_ID=0
    # Required for ROS2 DDS peer discovery to reach the robot on the lab LAN.
    network_mode: host
    volumes:
      - .:/app
    depends_on:
      - ollama
    stdin_open: true
    tty: true

volumes:
  ollama_models: