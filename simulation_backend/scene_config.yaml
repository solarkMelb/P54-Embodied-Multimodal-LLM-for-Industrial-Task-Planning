  - id:           obj_007
    label:        workstation
    urdf:         simulation_backend/assets/block_urdf/workstation.urdf
    color:        [0.35, 0.35, 0.35, 1.0]
    position:     [0.80, 0.00, 0.00]
    orientation:  [0.0, 0.0, 0.0, 1.0]
    mass_kg:      0.0
    graspable:    false
