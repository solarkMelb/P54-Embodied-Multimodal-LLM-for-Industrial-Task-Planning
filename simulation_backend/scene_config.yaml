  - id:           obj_006
    label:        right tray
    urdf:         simulation_backend/assets/block_urdf/tray.urdf
    color:        [0.55, 0.55, 0.55, 1.0]
    position:     [0.65, -0.45, 0.01]
    orientation:  [0.0, 0.0, 0.0, 1.0]
    mass_kg:      0.0
    graspable:    false
    attributes:
      color:      grey
